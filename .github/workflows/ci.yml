name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install .
      - run: hq --help
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check hq/static/app.js
      - run: node --check hq/static/float.js
      - run: node --check hq/static/float-lab.js
      - run: node tests/test_ui.js
  panel:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swiftc -typecheck hq/FloatPanel.swift
  install:
    # The one-line install a friend runs, piped to sh from a fresh home with no uv, in the
    # locale a Mac's Terminal uses, stopping before setup.
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sh -n install.sh
      - name: Install into an empty home
        run: |
          home="$(mktemp -d)"
          env -i HOME="$home" PATH=/usr/bin:/bin LANG=en_US.UTF-8 HQ_SOURCE="$PWD" HQ_NO_SETUP=1 sh < install.sh
          env -i HOME="$home" PATH=/usr/bin:/bin "$home/.local/bin/hq" setup --help
          # The installed hq names the commit it was installed from.
          version="$(env -i HOME="$home" PATH=/usr/bin:/bin "$home/.local/bin/hq" --version)"
          echo "$version"
          case "$version" in *"($(git rev-parse HEAD | cut -c1-7)"*) ;; *) exit 1 ;; esac
