[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hq-local"
version = "0.1.0"
description = "A local inbox for your AI agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hq = "hq.cli:main"

[tool.setuptools.package-data]
hq = ["static/*", "AGENT_GUIDE.md", "FloatPanel.swift"]
